name: Build FingerPhysics

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build FingerPhysics.csproj --configuration Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: FingerPhysics-Nomad
          path: bin/Release/FingerPhysics.dll
